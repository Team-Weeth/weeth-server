server:
  tomcat:
    mbeanregistry: # Tomcat Threads 확인을 위한 설정
      enabled: true

spring:
  application:
    name: weeth-server
  profiles:
    active: local
    group:
      local-monitoring:
        - local
  jpa:
    open-in-view: false
  flyway:
    enabled: false

springdoc:
  use-fqn: true
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

auth:
  providers:
    kakao:
      authorize_uri: https://kauth.kakao.com/oauth/authorize
      client_id: ${KAKAO_CLIENT_ID}
      redirect_uri: ${KAKAO_REDIRECT_URI}
      grant_type: ${KAKAO_GRANT_TYPE}
      token_uri: ${KAKAO_TOKEN_URI}
      user_info_uri: ${KAKAO_USER_INFO_URI}
    apple:
      client_id: ${APPLE_CLIENT_ID}
      team_id: ${APPLE_TEAM_ID}
      key_id: ${APPLE_KEY_ID}
      redirect_uri: ${APPLE_REDIRECT_URI}
      token_uri: https://appleid.apple.com/auth/token
      keys_uri: https://appleid.apple.com/auth/keys
      private_key_path: ${APPLE_PRIVATE_KEY_PATH}
      frontend_redirect_uri: ${APPLE_FRONTEND_REDIRECT_URI}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    build:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: weeth-server
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s

app:
  file:
    cdn-base-url: ${CDN_BASE_URL:}
    presigned-url-expiration-minutes: 5

career-net:
  key: ${CAREER_NET_API_KEY}
  base-url: https://www.career.go.kr/cnet/openapi/getOpenApi

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

# v3 에디터(마크다운)로 작성된 게시글 본문을 조회 시 Tiptap HTML 로 변환한다.
# editor-migrated-at 이 있어야 변환이 동작하고, 없으면 본문을 그대로 내려준다.
# club-id 를 지정하면 해당 동아리 글만 변환한다. 비우면 동아리를 가리지 않는다.
legacy-content:
  editor-migrated-at: ${LEGACY_CONTENT_EDITOR_MIGRATED_AT:}
  club-id: ${LEGACY_CONTENT_CLUB_ID:}

notion:
  token: ${NOTION_TOKEN}
  version: ${NOTION_VERSION}
  inquiry-database-id: ${NOTION_INQUIRY_DATABASE_ID}
