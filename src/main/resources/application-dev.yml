server:
  port: ${SERVER_PORT}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
weeth:
  jwt:
    key: ${JWT_KEY}
    access:
      expiration: ${ACCESS_EXP}
      header: ${ACCESS_HEAD}
    refresh:
      expiration: ${REFRESH_EXP}
      header: ${REFRESH_HEAD}
  cookie:
    access-token-name: ${ACCESS_HEAD}
    refresh-token-name: ${REFRESH_HEAD}
    domain: ${COOKIE_DOMAIN:}
    same-site: ${COOKIE_SAME_SITE:Lax}
    secure: false
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false

# v3 에디터로 작성된 게시글 본문을 조회 시 Tiptap HTML 로 변환한다.
# dev DB 의 동아리 TSID 는 운영과 다르므로 여기에 값을 두지 않고 환경 변수로만 켠다.
#   LEGACY_CONTENT_CLUB_ID=<dev leets 동아리 TSID>
#   LEGACY_CONTENT_EDITOR_MIGRATED_AT=2026-09-20T00:00:00
# 두 값이 모두 있어야 변환이 동작하며, 없으면 본문을 그대로 내려준다.
