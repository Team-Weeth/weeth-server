name: Deploy Monitoring (Prod)

# 운영 서버가 설정되지 않았기 때문에 수동 실행 설정
on:
#  push:
#    branches: [ main ]
#    paths:
#    - "infra/prod/monitoring/**"
#    - ".github/workflows/deploy-monitoring-prod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload monitoring files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          source: "infra/prod/monitoring"
          target: "${{ secrets.PROD_DEPLOY_DIR }}"

      - name: Deploy monitoring stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.PROD_DEPLOY_DIR }}/infra/prod/monitoring"
            chmod +x "$DEPLOY_DIR/scripts/deploy.sh"
            DEPLOY_DIR="$DEPLOY_DIR" "$DEPLOY_DIR/scripts/deploy.sh"
