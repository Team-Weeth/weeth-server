name: PR Labeler

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          # 수동으로 붙인 라벨(💥 Breaking, 🩹 Patch 등)은 유지
          sync-labels: false
