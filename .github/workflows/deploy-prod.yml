name: Deploy Prod

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}

jobs:
  # main에 머지되지 않은 커밋(예: dev를 타깃으로 publish된 릴리즈)이 운영에 나가지 않도록 차단
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release $TAG_NAME ($GITHUB_SHA) is not on main. Aborting prod deploy."
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew clean build -x test --no-daemon

      # ARM Docker Build 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64 # t4g small 배포를 위한 arm platform 설정
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_REPOSITORY }}:prod-latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # /infra/prod 하위 파일 EC2로 복사
      - name: Upload deployment files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          source: "infra/prod"
          target: "${{ secrets.PROD_DEPLOY_DIR }}"

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USER }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.PROD_DEPLOY_DIR }}/infra/prod"
            chmod +x "$DEPLOY_DIR/scripts/deploy.sh"

            APP_IMAGE="${{ env.IMAGE_REPOSITORY }}:${{ github.event.release.tag_name }}" \
            DOMAIN="${{ secrets.PROD_DOMAIN }}" \
            DEPLOY_DIR="$DEPLOY_DIR" \
            "$DEPLOY_DIR/scripts/deploy.sh"

  # 어느 단계에서 끝나든 결과를 Slack으로 알린다 (SLACK_WEBHOOK_URL 미설정 시 건너뜀)
  notify:
    needs: [verify, build, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "SLACK_WEBHOOK_URL is not set. Skip."
            exit 0
          fi

          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            text="✅ *$TAG_NAME* 운영 배포 완료 · <$RELEASE_URL|릴리즈 노트>"
          else
            # 처음으로 성공하지 못한 단계 (이후 단계는 skipped)
            stage=deploy result=$DEPLOY_RESULT
            for s in verify:$VERIFY_RESULT build:$BUILD_RESULT; do
              if [[ "${s#*:}" != "success" ]]; then
                stage=${s%%:*} result=${s#*:}
                break
              fi
            done
            text="❌ *$TAG_NAME* 운영 배포 실패 ($stage: $result) · <$RUN_URL|Actions 로그>"
          fi

          payload=$(jq -nc --arg text "$text" '{text: $text}')
          curl -fsS --max-time 10 -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null \
            || echo "::warning::Slack 알림 전송 실패"
