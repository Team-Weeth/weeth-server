global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "weeth-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app-blue:8080", "app-green:8080"]
        labels:
          app: weeth
          env: dev

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: dev

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          env: dev

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          env: dev
