global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "weeth-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: weeth
          env: local

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          env: local
