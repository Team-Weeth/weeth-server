stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 72h

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
  registry:
    external_labels:
      source: tempo
  traces_storage:
    path: /var/tempo/generator/traces
