global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "weeth-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app-blue:8080", "app-green:8080"]
        labels:
          app: weeth
          env: prod

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: prod

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          env: prod

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          env: prod

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          env: prod

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          env: prod

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          env: prod
