stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  max_attribute_bytes: 1024
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

query_frontend:
  max_query_expression_size_bytes: 32768
  search:
    default_spans_per_span_set: 1
    max_spans_per_span_set: 20

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_S3_BUCKET}
      endpoint: s3.${AWS_REGION}.amazonaws.com
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 720h

overrides:
  defaults:
    global:
      max_bytes_per_trace: 3000000
