apiVersion: 1

# Slack 웹훅은 서버의 .env.monitoring 에 SLACK_ALERT_WEBHOOK_URL 로 넣는다 (Grafana 컨테이너 env_file)
contactPoints:
  - orgId: 1
    name: weeth-slack
    receivers:
      - uid: weeth-slack
        type: slack
        settings:
          url: ${SLACK_ALERT_WEBHOOK_URL}
          title: '{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} [weeth-prod] {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: weeth-slack
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: weeth-prod-infra
    folder: Alerts
    interval: 1m
    rules:
      - uid: weeth-prod-disk-usage
        title: 루트 디스크 사용률 80% 이상
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [80] }
        for: 5m
        # 디스크가 꽉 차면 Prometheus 자체가 멈춰 데이터가 끊긴다 — 그 경우도 알림으로 본다
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: '루트 디스크 사용률 {{ printf "%.1f" $values.B.Value }}% — 로그·이미지 정리 또는 EBS 증설 필요'

      - uid: weeth-prod-app-down
        title: weeth 앱 응답 없음
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # blue/green 중 하나는 항상 내려가 있으므로 둘 중 최대값으로 판단한다
              expr: max(up{job="weeth-app"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 'app-blue / app-green 모두 Prometheus 수집 실패 — 앱 컨테이너 상태 확인 필요'
