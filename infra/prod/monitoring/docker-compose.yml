name: weeth-prod-monitoring

# 앱(blue/green) 외 컨테이너 공통 Docker 로그 제한 — 제한이 없으면 json 로그가 디스크를 채운다
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  alloy:
    image: grafana/alloy:v1.9.0
    logging: *default-logging
    group_add:
      - "${DOCKER_GID}"
    env_file:
      - ${MONITORING_ENV_FILE:-../.env.monitoring}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
    networks:
      - monitoring
      - weeth-app
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    logging: *default-logging
    env_file:
      - ${MONITORING_ENV_FILE:-../.env.monitoring}
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/loki-config.yaml", "-config.expand-env=true"]
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - monitoring
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    logging: *default-logging
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - monitoring
      - weeth-app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    logging: *default-logging
    # 이미지 기본 인자를 대체하므로 config/storage 경로도 함께 지정한다. 기간·용량 중 먼저 닿는 쪽으로 정리된다
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - weeth-app
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.0
    logging: *default-logging
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    logging: *default-logging
    env_file:
      - ${MONITORING_ENV_FILE:-../.env.monitoring}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${DOMAIN}${MONITORING_PATH}/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - prometheus
    networks:
      - monitoring
      - weeth-app
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  weeth-app:
    external: true
    name: weeth-prod_web

volumes:
  grafana_data:
  loki_data:
  prometheus_data:
